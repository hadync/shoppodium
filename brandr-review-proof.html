<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Card Proof - Brandr</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#080b11;--blue:#0b79d0;--ink:#eef2f7;--steel:#8c98a8;--edge:rgba(238,242,247,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:28px 20px 60px;text-align:center}.brand{font-family:'Archivo Black';font-size:24px;margin-bottom:34px}.brand span{color:var(--blue)}h1{font-family:'Archivo Black';font-size:32px;line-height:1.05;margin:0 0 8px}.sub{color:var(--steel);font-size:14px;margin-bottom:28px}.card{width:min(100%,420px);aspect-ratio:1.586;background:#151922;border-radius:8px;margin:0 auto 24px;padding:28px;position:relative;box-shadow:0 22px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}.card:after{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.08);border-radius:8px;pointer-events:none}.eyebrow{font-family:'Archivo Black';font-size:16px}.title{font-family:'Archivo Black';font-size:31px;line-height:1;color:#fff;margin-top:8px}.stars{color:#0b79d0;font-size:21px;letter-spacing:3px;margin:10px 0}.qr{width:125px;height:125px;background:#fff;padding:7px;border-radius:3px;display:block}.thanks{font-family:'Archivo Black';font-size:18px;margin-top:12px}.shop{font-weight:700;color:#0b79d0;margin-top:5px;font-size:12px;letter-spacing:.4px;text-transform:uppercase}.hint{color:#8c98a8;font-size:10px;margin-top:8px}.actions{display:flex;gap:10px;justify-content:center}.btn{border:1px solid var(--edge);background:transparent;color:var(--ink);border-radius:8px;padding:13px 17px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue)}.status{color:var(--steel);font-size:12px;margin-top:14px}.scan{font-size:12px;color:var(--steel);margin-top:10px}@media print{body{background:#fff}.wrap{padding:0}.brand,h1,.sub,.actions,.status,.scan{display:none}.card{box-shadow:none;margin:0;width:100%;max-width:420px}}</style></head><body><div class="wrap"><div class="brand">brand<span>r</span></div><h1>Your Review Card</h1><div class="sub">This is the exact QR destination customers will use.</div><div class="card"><div class="eyebrow">ENJOYING YOUR EXPERIENCE?</div><div class="title">LEAVE US A REVIEW</div><div class="stars">★★★★★</div><img id="qr" class="qr" alt="Your review QR code"><div class="thanks">THANK YOU!</div><div id="shop" class="shop"></div><div class="hint">IT ONLY TAKES 30 SECONDS.</div></div><div class="scan">Scan the QR code with your phone before approving.</div><div class="actions"><button class="btn" onclick="history.back()">Edit</button><button class="btn primary" id="approve">Approve & Continue &rarr;</button></div><div id="status" class="status"></div></div><script>const p=new URLSearchParams(location.search),u=p.get('url'),shop=p.get('shop')||'Your Shop';if(!u){location.href='/brandr-home.html'}else{document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data='+encodeURIComponent(u);document.getElementById('shop').textContent=shop}document.getElementById('approve').onclick=()=>{sessionStorage.setItem('brandr_review_approved','1');location.href='/brandr-setup.html?reviewApproved=1'};</script></body></html>
