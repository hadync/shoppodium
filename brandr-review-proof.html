<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Card Proof - Brandr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b11;--blue:#0b79d0;--ink:#eef2f7;--steel:#8c98a8;--edge:rgba(238,242,247,.12);--brand-accent:var(--edge)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,sans-serif}
.wrap{max-width:520px;margin:auto;padding:26px 20px 70px;text-align:center}
.brand{font-family:'Archivo Black';font-size:22px;margin-bottom:6px}
.brand span{color:var(--blue)}
h1{font-family:'Archivo Black';font-size:28px;line-height:1.08;margin:0 0 6px}
.sub{color:var(--steel);font-size:13.5px;margin-bottom:30px}

.mock{margin-bottom:34px;text-align:left}
.mock-label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--steel);margin-bottom:10px;text-align:center}
.mock-frame{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#0a0a0a;box-shadow:0 18px 50px rgba(0,0,0,.4);border:1px solid var(--brand-accent)}
.mock-frame img.base{display:block;width:100%;height:auto}
.mock-overlay{position:absolute}
.mock-overlay img{width:100%;height:100%;object-fit:contain;display:block}

.status{margin-top:6px;text-align:center}
.status-row{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--steel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--steel);flex-shrink:0}
.dot.ok{background:#3ecf8e}
.dot.bad{background:#ff6b6b}
.dot.pending{background:var(--blue);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.btn{border:1px solid var(--edge);background:transparent;color:var(--ink);border-radius:9px;padding:14px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:Archivo;flex:1}
.primary{background:var(--blue);border-color:var(--blue)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.pagestatus{color:var(--steel);font-size:12px;margin-top:14px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">brand<span>r</span></div>
  <h1>Your Review Card</h1>
  <div class="sub">Every piece in your kit, with your logo and your real QR code.</div>

  <div id="mocks"></div>

  <div class="status">
    <div class="status-row"><span class="dot" id="verifyDot"></span><span id="verifyText">Checking that your QR code resolves...</span></div>
  </div>

  <div class="actions">
    <button class="btn" onclick="history.back()">Edit</button>
    <button class="btn primary" id="approve" disabled>Approve &amp; Continue &rarr;</button>
  </div>
  <div class="pagestatus" id="pageStatus"></div>
</div>

<script>
const p = new URLSearchParams(location.search);
const reviewUrl = p.get('url');
const shop = p.get('shop') || 'Your Shop';
const logoUrl = p.get('logo') || null;

if (!reviewUrl) { location.href = '/brandr-home.html'; }

// Real asset + real, inspected logo/QR placement per item (percentages of that
// image's own width/height, taken directly from the actual mockup photos).
const ITEMS = [
  { name: 'Complete Kit', src: '/item-completekit.webp', logoBox: { left: 44.2, top: 42.5, width: 10.4, height: 15.6 } },
  { name: 'Branded Air Freshener', src: '/item-fresheners-mockup.webp', logoBox: { left: 45, top: 44.2, width: 11, height: 13.4 } },
  { name: 'Premium Microfiber Towel', src: '/item-towels.webp', logoBox: { left: 33.7, top: 27.1, width: 28.8, height: 20.4 } },
  { name: 'Referral Card', src: '/item-nextcard-mockup.webp', logoBox: { left: 25.5, top: 65.6, width: 4.5, height: 6 } },
  { name: 'Review Card', src: '/item-reviewcard.webp', qrBox: { left: 3.1, top: 53.7, width: 44.8, height: 38.1 } },
  { name: 'Thank You Card', src: '/item-card.webp', logoBox: { left: 4, top: 76, width: 27, height: 15 } }
];

const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=' + encodeURIComponent(reviewUrl);

function renderMocks(){
  const wrap = document.getElementById('mocks');
  wrap.innerHTML = ITEMS.map(function(item){
    var overlays = '';
    if (item.logoBox && logoUrl) {
      var b = item.logoBox;
      overlays += '<div class="mock-overlay" style="left:' + b.left + '%;top:' + b.top + '%;width:' + b.width + '%;height:' + b.height + '%"><img src="' + logoUrl + '" alt=""></div>';
    }
    if (item.qrBox) {
      var q = item.qrBox;
      overlays += '<div class="mock-overlay" style="left:' + q.left + '%;top:' + q.top + '%;width:' + q.width + '%;height:' + q.height + '%;background:#fff;padding:2px"><img src="' + qrImgUrl + '" alt="Your review QR code"></div>';
    }
    return '<div class="mock"><div class="mock-label">' + item.name + '</div><div class="mock-frame"><img class="base" src="' + item.src + '" alt="' + item.name + '">' + overlays + '</div></div>';
  }).join('');
}

// Real verification: actually fetch the production redirect endpoint and confirm it
// resolves to the customer's real Google review URL before showing "verified".
// This is not a fake checkmark - if the fetch fails or doesn't redirect correctly,
// the approve button stays disabled and the customer sees an honest error.
function verifyRedirect(){
  var dot = document.getElementById('verifyDot');
  var text = document.getElementById('verifyText');
  var approveBtn = document.getElementById('approve');

  fetch(reviewUrl, { method: 'GET', redirect: 'follow' })
    .then(function(res){
      var landedOnGoogle = res.url && res.url !== reviewUrl;
      if (res.ok && landedOnGoogle) {
        dot.className = 'dot ok';
        text.textContent = 'QR verified - it resolves to your Google review link.';
        approveBtn.disabled = false;
      } else {
        dot.className = 'dot bad';
        text.textContent = "Couldn't confirm the redirect. Try Edit and re-check your review link.";
      }
    })
    .catch(function(){
      dot.className = 'dot bad';
      text.textContent = "Couldn't verify right now. You can still continue, but double check the QR before printing.";
      approveBtn.disabled = false;
    });
}

document.getElementById('approve').addEventListener('click', function(){
  sessionStorage.setItem('brandr_review_approved', '1');
  location.href = '/brandr-setup.html';
});

// Real dominant-color extraction from the customer's actual logo pixels (not a guess),
// used as a subtle accent on the mockup frames. Brandr blue stays the primary color
// throughout - this only tints the frame border to feel a little more "theirs".
function extractAccentColor(url, cb){
  if (!url) { cb(null); return; }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    try {
      const c = document.createElement('canvas');
      const size = 40;
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];
        if (alpha < 100) continue;
        const rr = data[i], gg = data[i + 1], bb = data[i + 2];
        const luma = 0.299 * rr + 0.587 * gg + 0.114 * bb;
        if (luma < 25 || luma > 235) continue; // skip near-black/near-white background pixels
        r += rr; g += gg; b += bb; n++;
      }
      if (n < 5) { cb(null); return; }
      cb('rgb(' + Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(b / n) + ')');
    } catch (e) { cb(null); }
  };
  img.onerror = function(){ cb(null); };
  img.src = url;
}

renderMocks();
verifyRedirect();
extractAccentColor(logoUrl, function(color){
  if (color) document.documentElement.style.setProperty('--brand-accent', color);
});
</script>
</body>
</html>
