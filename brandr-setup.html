<script>
const SUPABASE_URL='https://cajerxgiwbgevfjzkkoy.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhamVyeGdpd2JnZXZmanpra295Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDY0NDcsImV4cCI6MjA5NjAyMjQ0N30.8dCTpfeWkdUIjmKGgfnrOqlBa1jIwDt_yqg3Dlt1a0M';const{createClient}=supabase;const sb=createClient(SUPABASE_URL,SUPABASE_KEY);let product=null,qty=null;function getQty(){const q=parseInt(new URLSearchParams(location.search).get('qty'),10);if(q&&q>0){sessionStorage.setItem('brandr_qty',String(q));return q}const s=parseInt(sessionStorage.getItem('brandr_qty'),10);return s&&s>0?s:null}function showError(msg){const e=document.getElementById('formErr');e.textContent=msg;e.style.display=msg?'block':'none'}async function uploadLogo(){const input=document.getElementById('logoFile'),file=input.files&&input.files[0];if(!file)return null;const ext=file.name.split('.').pop();const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const r=await sb.storage.from('brandr-logos').upload(path,file);if(r.error){console.error(r.error);return null}return sb.storage.from('brandr-logos').getPublicUrl(path).data.publicUrl}document.getElementById('logoFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];document.getElementById('fileName').textContent=f?f.name:'';document.getElementById('fileLabel').textContent=f?'Selected:':'Click to upload PNG, JPG, or SVG'});document.getElementById('ctaBtn').addEventListener('click',async function(){const bizName=document.getElementById('bizName').value.trim(),bizWeb=document.getElementById('bizWeb').value.trim(),bizEmail=document.getElementById('bizEmail').value.trim();if(!bizName){showError('Business name is required.');return}if(!bizEmail||!bizEmail.includes('@')){showError('A valid email is required.');return}if(!product||!qty){showError('Your order could not be loaded. Please go back to the kit page and try again.');return}showError('');const btn=this;btn.disabled=true;btn.textContent='Preparing checkout...';let logoUrl=null;try{logoUrl=await uploadLogo()}catch(e){console.error(e)}sessionStorage.setItem('brandr_biz',JSON.stringify({bizName,bizWeb,bizEmail,logoUrl}));const amount=Math.round(parseFloat(product.price_per_unit)*qty);let summary=qty+'x Monthly Brandr Kit, every month. Business: '+bizName+'.';if(bizWeb)summary+=' Web: '+bizWeb+'.';summary+=' Email: '+bizEmail+'.';if(logoUrl)summary+=' Logo: '+logoUrl+'.';let ref=null;try{const m=document.cookie.match(/brandr_ref=([^;]+)/);ref=m?decodeURIComponent(m[1]):null}catch(e){}try{const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,summary,ref,mode:'subscription',successUrl:'/brandr-confirmation.html',cancelUrl:'/build-kit.html'})});const d=await r.json();if(d.url){location.href=d.url}else{btn.disabled=false;btn.textContent='Continue to Secure Checkout →';showError('Checkout error: '+(d.error||'try again'))}}catch(e){btn.disabled=false;btn.textContent='Continue to Secure Checkout →';showError('Something went wrong. Try again in a sec.')}});(function init(){qty=getQty();if(!qty){location.href='/build-kit.html';return}sb.from('products').select('*').eq('slug','monthly-customer-kits').eq('active',true).maybeSingle().then(function(res){document.getElementById('state-loading').style.display='none';if(res.error||!res.data){showError('We could not load your kit. Please go back to the kit page and try again.');document.getElementById('state-main').style.display='block';return}product=res.data;document.getElementById('state-main').style.display='block';try{const saved=JSON.parse(sessionStorage.getItem('brandr_biz')||'{}');if(saved.bizName)document.getElementById('bizName').value=saved.bizName;if(saved.bizWeb)document.getElementById('bizWeb').value=saved.bizWeb;if(saved.bizEmail)document.getElementById('bizEmail').value=saved.bizEmail}catch(e){}})})();
