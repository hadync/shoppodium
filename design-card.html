<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandr Card Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
:root{--bg:#0a0a0a;--panel:#121212;--panel2:#171717;--ink:#eef2f7;--steel:#8c98a8;--edge:rgba(238,242,247,.10);--accent:#0b79d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,sans-serif;height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:230px 1fr 250px;grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/4;background:var(--panel);border-bottom:1px solid var(--edge);display:flex;align-items:center;padding:0 16px;gap:14px}
.topbar .wordmark{font-family:'Archivo Black';font-size:16px;text-transform:lowercase}
.topbar .spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--edge);color:var(--ink);padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:Archivo;display:flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--accent)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.primary{background:var(--accent);border-color:var(--accent)}
.sidebar{background:var(--panel);border-right:1px solid var(--edge);overflow-y:auto;padding:14px 12px}
.sidebar h3{font-size:10.5px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px;padding:0 2px}
.sidebar h3:first-child{margin-top:0}
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tmpl-grid.wide{grid-template-columns:1fr}
.tmpl-thumb{background:#000;border:1.5px solid var(--edge);border-radius:6px;overflow:hidden;cursor:pointer;padding:6px}
.tmpl-thumb:hover{border-color:var(--accent)}
.tmpl-thumb.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tmpl-thumb svg{width:100%;height:auto;display:block;pointer-events:none;border-radius:2px}
.tool-btn{width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--edge);color:var(--ink);padding:9px 11px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:Archivo;margin-bottom:6px;text-align:left}
.tool-btn:hover{border-color:var(--accent)}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.icon-btn{aspect-ratio:1;background:transparent;border:1px solid var(--edge);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:16px;height:16px}
.canvas-area{background:#1c1c1c;background-image:linear-gradient(45deg,#232323 25%,transparent 25%),linear-gradient(-45deg,#232323 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#232323 75%),linear-gradient(-45deg,transparent 75%,#232323 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:30px}
.canvas-shadow{box-shadow:0 20px 60px rgba(0,0,0,.6)}
.props{background:var(--panel);border-left:1px solid var(--edge);padding:14px;overflow-y:auto}
.props h3{font-size:10.5px;font-weight:800;color:var(--steel);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.props h3:first-child{margin-top:0}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--steel);margin-bottom:5px;font-weight:600}
.field select,.field input[type=range]{width:100%}
.field select{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);padding:7px 8px;border-radius:6px;font-family:Archivo;font-size:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--edge);cursor:pointer}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.colorpick{width:100%;height:34px;border:1px solid var(--edge);border-radius:6px;background:var(--panel2);cursor:pointer}
.empty-hint{color:var(--steel);font-size:12px;line-height:1.6;padding:8px 2px}
.textarea-btn{display:flex;gap:6px}
.textarea-btn button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--edge);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:11px;font-weight:700}
.textarea-btn button:hover{border-color:var(--accent)}
.textarea-btn button.danger:hover{border-color:#e05252;color:#e05252}
input[type=file]{display:none}

/* ---- Mobile layout (phone-width screens) ---- */
@media (max-width: 860px){
  body{overflow-y:auto;height:auto;min-height:100vh}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:20;flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px}
  .topbar .wordmark{font-size:14px}
  .tbtn{padding:7px 10px;font-size:11px}
  .sidebar{order:2;border-right:none;border-bottom:1px solid var(--edge);padding:10px;max-height:none}
  .sidebar h3{margin:10px 0 6px}
  .tmpl-grid{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .tmpl-thumb{flex:0 0 110px;width:110px}
  .canvas-area{order:1;padding:16px 10px;min-height:40vh}
  .canvas-area canvas{max-width:100%;height:auto!important}
  .props{order:3;border-left:none;border-top:1px solid var(--edge);max-height:none}
  .icon-grid{grid-template-columns:repeat(7,1fr)}
  .tool-btn{padding:11px 12px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="wordmark">brandr <span style="color:var(--steel);font-weight:400;font-size:13px">editor</span></span>
    <div class="spacer"></div>
    <button class="tbtn" id="undoBtn" title="Undo">&#8630; Undo</button>
    <button class="tbtn" id="redoBtn" title="Redo">&#8631; Redo</button>
    <button class="tbtn" id="deleteBtn">&#10005; Delete</button>
    <button class="tbtn" id="backBtn">Send back</button>
    <button class="tbtn" id="frontBtn">Bring front</button>
    <button class="tbtn primary" id="exportBtn">&#8595; Export PNG</button>
  </div>

  <div class="sidebar">
    <h3>Referral card templates</h3>
    <div class="tmpl-grid" id="tmplReferral"></div>
    <h3>Thank you templates</h3>
    <div class="tmpl-grid" id="tmplThankyou"></div>
    <h3>Business card templates</h3>
    <div class="tmpl-grid" id="tmplBusiness"></div>
  </div>

  <div class="canvas-area">
    <div class="canvas-shadow"><canvas id="c"></canvas></div>
  </div>

  <div class="props">
    <h3>Add elements</h3>
    <button class="tool-btn" id="addTextBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
      Add text
    </button>
    <button class="tool-btn" id="addLogoBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      Upload logo / image
    </button>
    <input type="file" id="logoFile" accept="image/*">
    <button class="tool-btn" id="addRectBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
      Rectangle
    </button>
    <button class="tool-btn" id="addCircleBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      Circle
    </button>
    <button class="tool-btn" id="addLineBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/></svg>
      Line
    </button>

    <h3>Icons</h3>
    <div class="icon-grid" id="iconGrid"></div>

    <div id="objProps"></div>
  </div>
</div>

const DIMS={referral:[576,384],thankyou:[336,192],business:[336,192]};

// ============================================================
// PART 3 - Fabric.js canvas engine
// ============================================================
let canvas=new fabric.Canvas('c',{preserveObjectStacking:true});
let history=[],historyStep=-1,suspendHistory=false;
let currentGroup='thankyou',currentIndex=0;

function fontFamily(f){return f==='disp'?'Archivo Black':'Archivo';}

function buildFromSpec(group,index){
  suspendHistory=true;
  canvas.clear();
  const [w,h]=DIMS[group];
  canvas.setWidth(w);canvas.setHeight(h);
  document.querySelector('.canvas-shadow').style.width=w+'px';
  const specs=(group==='referral'?referralSpecs:group==='thankyou'?thankyouSpecs:businessSpecs)[index];
  specs.forEach(s=>{
    let obj=null;
    if(s.t==='rect'){
      obj=new fabric.Rect({left:s.x,top:s.y,width:s.w,height:s.h,fill:s.fill==='transparent'?'':s.fill,stroke:s.stroke||null,strokeWidth:s.sw||0,rx:s.rx||0,ry:s.rx||0,strokeDashArray:s.dash||null});
      if(s.fill==='transparent')obj.set('fill','');
    } else if(s.t==='circle'){
      obj=new fabric.Circle({left:s.cx-s.r,top:s.cy-s.r,radius:s.r,fill:s.fill||'',stroke:s.stroke||null,strokeWidth:s.sw||0,strokeDashArray:s.dash||null});
    } else if(s.t==='line'){
      obj=new fabric.Line([s.x1,s.y1,s.x2,s.y2],{stroke:s.stroke||'#111318',strokeWidth:s.sw||1,strokeDashArray:s.dash||null});
    } else if(s.t==='poly'){
      obj=new fabric.Polygon(s.points.map(p=>({x:p[0],y:p[1]})),{left:0,top:0,fill:s.fill});
    } else if(s.t==='text'){
      obj=new fabric.Textbox(s.text.replace(/&middot;/g,'\u00b7'),{left:s.x,top:s.y-s.size,fontSize:s.size,fill:s.fill||'#111318',fontWeight:s.weight||400,fontFamily:fontFamily(s.family),textAlign:s.align||'left',width:280,editable:true});
      if(s.align==='center')obj.set('left',s.x-140);
      if(s.align==='right')obj.set('left',s.x-280);
    } else if(s.t==='logo'){
      const c=new fabric.Circle({left:-s.r,top:-s.r,radius:s.r,fill:'',stroke:s.stroke,strokeWidth:1.5,strokeDashArray:[3,3],originX:'center',originY:'center'});
      const t=new fabric.Text('LOGO',{fontSize:9,fontFamily:'Archivo',fontWeight:700,fill:s.stroke,originX:'center',originY:'center'});
      obj=new fabric.Group([c,t],{left:s.cx,top:s.cy,originX:'center',originY:'center'});
      obj.isLogoPlaceholder=true;
    }
    if(obj){canvas.add(obj);}
  });
  canvas.renderAll();
  suspendHistory=false;
  pushHistory();
  fitCanvasToContainer();
}

// Fabric sets explicit pixel width/height via inline styles on both canvas layers,
// so plain CSS max-width can't shrink it on a narrow phone screen. Scale the whole
// wrapper visually instead - Fabric maps pointer events off getBoundingClientRect,
// so interactions (drag/resize/click) keep working correctly at any scale.
function fitCanvasToContainer(){
  const area=document.querySelector('.canvas-area');
  const shadow=document.querySelector('.canvas-shadow');
  const pad=32;
  const availW=area.clientWidth-pad;
  const canvasW=canvas.getWidth();
  const scale=Math.min(1,availW/canvasW);
  shadow.style.transform='scale('+scale+')';
  shadow.style.transformOrigin='top center';
  shadow.style.marginBottom=(canvas.getHeight()*(scale-1))+'px';
}
window.addEventListener('resize',fitCanvasToContainer);
window.addEventListener('orientationchange',()=>setTimeout(fitCanvasToContainer,200));

// ---- History (undo/redo) ----
function pushHistory(){
  if(suspendHistory)return;
  history=history.slice(0,historyStep+1);
  history.push(JSON.stringify(canvas.toDatalessJSON(['isLogoPlaceholder'])));
  historyStep=history.length-1;
  document.getElementById('undoBtn').disabled=historyStep<=0;
  document.getElementById('redoBtn').disabled=historyStep>=history.length-1;
}
function loadHistory(step){
  suspendHistory=true;
  canvas.loadFromJSON(history[step],()=>{canvas.renderAll();suspendHistory=false;});
}
canvas.on('object:modified',pushHistory);
canvas.on('object:added',()=>{if(!suspendHistory)pushHistory();});
canvas.on('object:removed',()=>{if(!suspendHistory)pushHistory();});
document.getElementById('undoBtn').addEventListener('click',()=>{if(historyStep>0){historyStep--;loadHistory(historyStep);document.getElementById('redoBtn').disabled=false;if(historyStep<=0)document.getElementById('undoBtn').disabled=true;}});
document.getElementById('redoBtn').addEventListener('click',()=>{if(historyStep<history.length-1){historyStep++;loadHistory(historyStep);document.getElementById('undoBtn').disabled=false;if(historyStep>=history.length-1)document.getElementById('redoBtn').disabled=true;}});

// ---- Layer / delete controls ----
document.getElementById('deleteBtn').addEventListener('click',()=>{const o=canvas.getActiveObject();if(o){canvas.remove(o);canvas.discardActiveObject();canvas.renderAll();}});
document.getElementById('frontBtn').addEventListener('click',()=>{const o=canvas.getActiveObject();if(o){canvas.bringToFront(o);canvas.renderAll();pushHistory();}});
document.getElementById('backBtn').addEventListener('click',()=>{const o=canvas.getActiveObject();if(o){canvas.sendToBack(o);canvas.renderAll();pushHistory();}});

document.getElementById('addLogoBtn').addEventListener('click',()=>document.getElementById('logoFile').click());
document.getElementById('logoFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    fabric.Image.fromURL(ev.target.result,img=>{
      img.scaleToWidth(120);
      img.set({left:40,top:40});
      canvas.add(img);canvas.setActiveObject(img);canvas.renderAll();
    });
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

// ---- Template thumbnails ----
function renderThumbs(containerId,svgs,names,group){
  const el=document.getElementById(containerId);
  el.innerHTML=svgs.map((svg,i)=>'<div class="tmpl-thumb" data-group="'+group+'" data-index="'+i+'">'+svg+'</div>').join('');
  el.querySelectorAll('.tmpl-thumb').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tmpl-thumb').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentGroup=t.getAttribute('data-group');
    currentIndex=parseInt(t.getAttribute('data-index'),10);
    buildFromSpec(currentGroup,currentIndex);
  }));
}
renderThumbs('tmplReferral',referralSvg,null,'referral');

renderThumbs('tmplBusiness',businessSvg,null,'business');

// ---- Object properties panel (color, font, size) ----
const objProps=document.getElementById('objProps');
const PALETTE=['#111318','#ffffff','#faf7f2','#6b7280','#0b79d0','#c0392b','#2e7d32','#f2a900'];
function renderProps(){
  const o=canvas.getActiveObject();
  if(!o){objProps.innerHTML='<div class="empty-hint">Select an element on the canvas to edit its color, font, or size. Drag corners to resize, drag to move, double-click text to edit it.</div>';return;}
  let html='<h3>Selected element</h3>';
  html+='<div class="field"><label>Fill color</label><div class="swatches">'+PALETTE.map(c=>'<div class="swatch" data-color="'+c+'" style="background:'+c+'"></div>').join('')+'</div><input type="color" class="colorpick" id="customColor" style="margin-top:6px" value="'+(o.fill&&typeof o.fill==='string'?o.fill:'#111318')+'"></div>';
  if(o.type==='textbox'||o.type==='text'||o.type==='i-text'){
    html+='<div class="field"><label>Font</label><select id="fontSelect"><option value="Archivo">Archivo (body)</option><option value="Archivo Black">Archivo Black (display)</option><option value="Playfair Display">Playfair Display (editorial)</option><option value="Space Grotesk">Space Grotesk (modern)</option></select></div>';
    html+='<div class="field"><label>Size: <span id="sizeVal">'+Math.round(o.fontSize)+'</span>px</label><input type="range" id="sizeRange" min="8" max="60" value="'+Math.round(o.fontSize)+'"></div>';
    html+='<div class="field"><label>Weight</label><select id="weightSelect"><option value="400">Regular</option><option value="600">Semibold</option><option value="700">Bold</option><option value="900">Black</option></select></div>';
  }
  html+='<div class="textarea-btn"><button id="dupBtn">Duplicate</button><button class="danger" id="delBtn2">Delete</button></div>';
  objProps.innerHTML=html;

  objProps.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{o.set('fill',s.getAttribute('data-color'));canvas.renderAll();pushHistory();}));
  const cc=document.getElementById('customColor');
  if(cc)cc.addEventListener('input',e=>{o.set('fill',e.target.value);canvas.renderAll();});
  if(cc)cc.addEventListener('change',()=>pushHistory());
  const fs=document.getElementById('fontSelect');
  if(fs){fs.value=o.fontFamily||'Archivo';fs.addEventListener('change',e=>{o.set('fontFamily',e.target.value);canvas.renderAll();pushHistory();});}
  const sr=document.getElementById('sizeRange');
  if(sr)sr.addEventListener('input',e=>{o.set('fontSize',parseInt(e.target.value,10));document.getElementById('sizeVal').textContent=e.target.value;canvas.renderAll();});
  if(sr)sr.addEventListener('change',()=>pushHistory());
  const ws=document.getElementById('weightSelect');
  if(ws){ws.value=String(o.fontWeight||400);ws.addEventListener('change',e=>{o.set('fontWeight',e.target.value);canvas.renderAll();pushHistory();});}
  document.getElementById('dupBtn').addEventListener('click',()=>{o.clone(cloned=>{cloned.set({left:o.left+15,top:o.top+15});canvas.add(cloned);canvas.setActiveObject(cloned);canvas.renderAll();});});
  document.getElementById('delBtn2').addEventListener('click',()=>{canvas.remove(o);canvas.discardActiveObject();canvas.renderAll();});
}
canvas.on('selection:created',renderProps);
canvas.on('selection:updated',renderProps);
canvas.on('selection:cleared',renderProps);
