<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window Tint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#060708;
    --pane:#0b0e12;
    --pane2:#0d1014;
    --glass:#f4f2ec;
    --haze:#8d9198;
    --sun:#e8a33d;
    --edge:rgba(255,255,255,.08);
    --sheen:rgba(255,255,255,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  html{background:#050607}
  html::before{
    content:"";position:fixed;left:-10%;right:-10%;top:-240px;height:440px;z-index:0;
    background:radial-gradient(ellipse at center, color-mix(in srgb, var(--sun) 12%, transparent) 0%, color-mix(in srgb, var(--sun) 4%, transparent) 40%, transparent 70%);
    filter:blur(8px);pointer-events:none;
  }
  html::after{
    content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:1;
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--sun) 40%, transparent), transparent);
    pointer-events:none;
  }
  body{
    background:transparent;color:var(--glass);
    font-family:'Archivo',sans-serif;font-size:15.5px;line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  /* limo glow: warm light behind the tint, pinned to the bottom of the screen */
  body::before{
    content:"";position:fixed;left:-10%;right:-10%;bottom:-220px;height:440px;z-index:0;
    background:radial-gradient(ellipse at center, color-mix(in srgb, var(--sun) 16%, transparent) 0%, color-mix(in srgb, var(--sun) 5%, transparent) 40%, transparent 70%);
    filter:blur(8px);pointer-events:none;
  }
  body::after{
    content:"";position:fixed;left:0;right:0;bottom:0;height:1px;z-index:1;
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--sun) 50%, transparent), transparent);
    pointer-events:none;
  }
  body > *{position:relative;z-index:2}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .disp{font-family:'Archivo Black',sans-serif;font-weight:400}

  /* ============ THE GLASS PANE (hero) ============ */
  .hero{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
  }
  .pane-inner{position:relative;z-index:2;padding:56px 24px 10px;width:100%}
  .spec-top{
    font-size:11.5px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    color:var(--haze);margin-bottom:26px;
    display:flex;justify-content:center;align-items:center;gap:12px;
  }
  .spec-top i{font-style:normal;color:var(--sun)}
  .nm{
    font-family:'Archivo Black';font-size:clamp(39px,9vw,76px);
    line-height:.92;letter-spacing:-2px;color:var(--glass);
    text-shadow:0 2px 30px rgba(0,0,0,.85);
  }
  .nm .sub{display:block;color:var(--sun)}
  .nm sup{font-size:.2em;vertical-align:super;margin-left:5px;color:var(--haze)}
  .startprice{
    margin-top:14px;display:flex;justify-content:center;align-items:center;gap:9px;
    font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--haze);
  }
  .startprice b{
    font-family:'Archivo Black';font-size:26px;letter-spacing:-.5px;
    color:var(--sun);text-transform:none;
  }
  .phone{
    display:inline-block;margin-top:20px;text-decoration:none;
    font-family:'Archivo Black';font-size:18px;letter-spacing:.3px;color:#171004;
    background:var(--sun);padding:15px 34px;border-radius:12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 30px rgba(0,0,0,.5);
  }
  .phone:hover{filter:brightness(1.06)}
  .phone small{display:none}
  .badges{display:flex;justify-content:center;flex-wrap:wrap;margin-top:18px;row-gap:6px}
  .badges span{
    font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--haze);
  }
  .badges span:not(:last-child)::after{
    content:"/";color:var(--sun);margin:0 8px;font-weight:900;
  }

  .rateline{margin-top:7px;display:flex;justify-content:center;align-items:baseline;gap:6px}
  .rateline b{font-family:'Archivo Black';font-size:17px}
  .rateline i{font-style:normal;color:var(--sun);font-size:15px}
  .rateline span{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--haze)}

  /* booking */
  .booknow{padding:0 0 8px;text-align:center}
  .embed-frame{max-width:560px;margin:0 auto;min-height:600px;position:relative}
  .embed-frame iframe{display:block;width:100%;height:860px;border:0}
  .embed-note{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--haze);font-size:14px;gap:6px;padding:20px;
  }
  .booknow .under{font-size:12.5px;color:var(--haze);margin-top:12px}
  .booknow .under b{color:var(--sun);font-weight:700}

  /* verified */
  .verified{padding:40px 0 6px;text-align:center}
  .v-chip{
    display:inline-flex;align-items:center;gap:11px;
    padding:13px 24px;text-decoration:none;border-radius:999px;
  }
  .v-chip:hover{border-color:rgba(255,255,255,.2)}
  .v-check{
    width:23px;height:23px;border-radius:50%;
    background:var(--sun);color:#171004;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;
  }
  .v-chip b{font-family:'Archivo Black';font-size:15px;color:var(--glass)}
  .v-chip span{font-size:12.5px;color:var(--haze)}
  .v-sub{font-size:12px;color:var(--haze);margin-top:10px}

  /* schedule + footer */
  footer{padding:44px 0 100px;font-size:12px;color:var(--haze);text-align:center}

  .callbar{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:40;display:none;
    background:var(--sun);color:#171004;text-align:center;
    font-family:'Archivo Black';font-size:16px;letter-spacing:.3px;
    padding:15px 0;text-decoration:none;border-radius:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 12px 34px rgba(0,0,0,.6);
  }
  @media (max-width:640px){ .callbar{display:block} }
  @media (max-width:560px){
    .shots{grid-template-columns:repeat(2,1fr)}
    .std-grid{grid-template-columns:1fr}
    
    .pane-inner{padding:44px 18px 6px}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
</style>
</head>

<div class="hero nophoto" id="hero">
  <div class="pane-inner">
    <div class="spec-top"><span id="shopCity"></span><i>&middot;</i><span>Appointment only</span></div>

</div>

</div>

<footer id="footerLine"></footer>
