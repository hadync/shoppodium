<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b11;--bg2:#0e131b;--blue:#2f9fe6;--blue2:#4fc0ff;--ink:#eef2f7;--steel:#8c98a8;--edge:rgba(238,242,247,.10);--glow:rgba(47,159,230,.30)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;line-height:1.5;text-align:center;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:48px 20px 62px}
.z{width:50px;height:auto;margin:0 auto 22px;display:block;filter:drop-shadow(0 0 18px var(--glow))}
h1{font-family:'Archivo Black';font-size:clamp(24px,5vw,35px);line-height:1.05;letter-spacing:-.4px;margin-bottom:28px}
h1 .b{color:var(--blue2)}
.toggle{display:flex;gap:5px;justify-content:center;background:var(--edge);padding:5px;border-radius:99px;max-width:330px;margin:0 auto 22px}
.toggle button{flex:1;border:none;background:none;color:var(--steel);font-family:'Barlow Condensed';font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:13px;padding:10px;border-radius:99px;cursor:pointer;transition:.2s}
.toggle button.on{background:var(--blue);color:#04121d}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tier{background:var(--bg2);border:1px solid var(--edge);border-radius:14px;padding:23px 15px;transition:.2s}
.tier.feat{border-color:var(--blue);box-shadow:0 0 44px rgba(47,159,230,.14)}
.tier .name{font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--steel);font-size:14px}
.tier .amt{font-family:'Archivo Black';font-size:33px;margin:8px 0 3px}
.tier .amt i{font-size:15px;color:var(--steel);font-style:normal;font-weight:400}
.tier .q{color:var(--steel);font-size:13px;min-height:36px;margin-bottom:5px}
.tier a{display:block;margin-top:12px;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:14px;padding:11px;border-radius:8px;text-decoration:none;background:var(--blue);color:#04121d;transition:.2s}
.tier a:hover{background:var(--blue2);box-shadow:0 0 22px var(--glow)}
@media(max-width:600px){.tiers{grid-template-columns:1fr}}
.picklabel{color:var(--steel);font-size:14px;margin:0 auto 16px}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:600px;margin:0 auto 30px}
@media(max-width:600px){.picker{grid-template-columns:repeat(3,1fr)}}
.pick{background:var(--bg2);border:1px solid var(--edge);border-radius:12px;padding:12px 8px 10px;cursor:pointer;transition:.18s;position:relative}
.pick.on{border-color:var(--blue);box-shadow:0 0 20px rgba(47,159,230,.12)}
.pick:not(.on){opacity:.4}
.pick:hover{border-color:var(--blue)}
.pick .ex{height:58px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.pick .pname{font-family:'Barlow Condensed';font-weight:600;font-size:12px;line-height:1.1;color:var(--ink);letter-spacing:.3px}
.pick .pprice{font-family:'Barlow Condensed';font-weight:700;font-size:12px;color:var(--blue2);margin-top:3px}
.pick .pprice span{color:var(--steel);font-weight:400;font-size:10px}
.pick.on::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--blue2);font-size:12px;font-weight:700}
/* mini mockups */
.exFresh{width:34px;height:46px;background:#0b0f16;border:1.5px solid var(--blue);border-radius:6px 6px 18px 18px;display:flex;align-items:center;justify-content:center;position:relative}
.exFresh img{width:22px}
.exFresh .exhole{position:absolute;top:4px;width:5px;height:5px;border:1px solid var(--steel);border-radius:50%}
.exCard{width:56px;height:38px;background:#0b0f16;border:1px solid var(--blue);border-radius:5px;display:flex;align-items:center;justify-content:space-around;padding:0 5px}
.exCard img{width:20px}
.exCard .exqr{width:14px;height:14px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/5px 5px}
.exTowel{width:52px;height:40px;background:#0b0f16;border:1px dashed var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center}
.exTowel img{width:26px;opacity:.92}
.exSticker{width:44px;height:44px;background:#0b0f16;border:1px solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center}
.exSticker img{width:26px}
.exCling{width:42px;height:46px;background:#0b0f16;border:1px solid var(--blue);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.exCling img{width:24px}
.exCling .exdate{width:24px;height:4px;background:var(--steel);border-radius:2px;opacity:.5}
.exBcard{width:56px;height:34px;background:#0b0f16;border:1px solid var(--blue);border-radius:5px;display:flex;align-items:center;justify-content:center}
.exBcard img{width:24px}
.exKey{display:flex;flex-direction:column;align-items:center}
.exKey .exring{width:12px;height:12px;border:2px solid var(--steel);border-radius:50%;margin-bottom:-3px}
.exKey .exfob{width:34px;height:30px;background:#0b0f16;border:1px solid var(--blue);border-radius:5px;display:flex;align-items:center;justify-content:center}
.exKey .exfob img{width:20px}
.exLany{display:flex;flex-direction:column;align-items:center}
.exLany .exstrap{width:8px;height:14px;background:var(--blue);opacity:.5;margin-bottom:-2px}
.exLany .exbadge{width:32px;height:28px;background:#0b0f16;border:1px solid var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center}
.exLany .exbadge img{width:18px}
.exPen{width:50px;height:14px;background:#0b0f16;border:1px solid var(--blue);border-radius:99px;display:flex;align-items:center;padding:0 6px}
.exPen img{width:18px}
.exDecal{width:46px;height:40px;background:#0b0f16;border:1px solid var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.exDecal::before{content:"";position:absolute;inset:4px;border:1px dashed rgba(47,159,230,.4);border-radius:3px}
.exDecal img{width:24px}

.vol{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px;margin:0 auto 20px}
.vol button{flex:1;min-width:70px;border:1px solid var(--edge);background:var(--bg2);color:var(--steel);font-family:'Barlow Condensed';font-weight:600;letter-spacing:.5px;font-size:13px;padding:9px 6px;border-radius:9px;cursor:pointer;transition:.18s}
.vol button.on{background:var(--blue);border-color:var(--blue);color:#04121d}
.vol button:hover{border-color:var(--blue)}
.quote{background:var(--bg2);border:1px solid var(--blue);border-radius:16px;padding:28px 22px;max-width:360px;margin:0 auto;box-shadow:0 0 44px rgba(47,159,230,.13)}
.qamt{font-family:'Archivo Black';font-size:46px;line-height:1}
.qamt i{font-size:17px;color:var(--steel);font-style:normal;font-weight:400}
.qbreak{color:var(--steel);font-size:13px;margin:8px 0 18px;line-height:1.5}
.qbtn{display:block;font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:16px;padding:14px;border-radius:10px;text-decoration:none;background:var(--blue);color:#04121d;transition:.2s}
.qbtn:hover{background:var(--blue2);box-shadow:0 0 24px var(--glow)}
.qnote{color:var(--steel);font-size:11.5px;line-height:1.5;margin-top:14px}
</style>
</head>

<script>
// VOLT pricing engine
var PRICE={fresheners:1.50,card:0.45,towels:2.75,stickers:0.60,clings:0.50,cards:0.25,keychains:1.25,lanyards:1.60,pens:0.65,decals:1.10};
var BAG=0.35, FLOOR=99, SHIP=11;
var fmt='bags', vol=50;
var LINKS={ // nearest fixed Stripe link by rough monthly total
  loose:[[160,"https://buy.stripe.com/3cI8wP8Mwa3o39Zcynawo02"],[240,"https://buy.stripe.com/fZubJ15Ak2AW7qf8i7awo03"],[99999,"https://buy.stripe.com/14A28r8Mwcbw4e355Vawo04"]],
  bags:[[180,"https://buy.stripe.com/4gM4gz5Ak0sO39Z41Rawo05"],[280,"https://buy.stripe.com/eVq7sL8Mw7VgfWL7e3awo06"],[99999,"https://buy.stripe.com/00wfZh7Isb7sfWL41Rawo07"]]
};
function selectedItems(){return Array.prototype.slice.call(document.querySelectorAll('.pick.on')).map(function(p){return p.getAttribute('data-k');});}
function calc(){
  var sel=selectedItems();
  var unit=sel.reduce(function(s,k){return s+(PRICE[k]||0);},0);
  if(fmt==='bags') unit+=BAG;
  var monthly=unit*vol;
  if(monthly<FLOOR) monthly=FLOOR;
  monthly=Math.round(monthly);
  document.getElementById('qamt').innerHTML='$'+monthly+'<i>/mo</i>';
  var carsTxt=vol+' of each';
  document.getElementById('qbreak').textContent=sel.length+' item'+(sel.length>1?'s':'')+', '+carsTxt+' per month, '+(fmt==='bags'?'gift bags':'loose')+'.';
  // route to nearest fixed Stripe link
  var tbl=LINKS[fmt]; var link=tbl[tbl.length-1][1];
  for(var i=0;i<tbl.length;i++){if(monthly<=tbl[i][0]){link=tbl[i][1];break;}}
  document.getElementById('qbtn').href=link;
}
function setF(f){fmt=f;document.querySelectorAll('.toggle button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-f')===f);});calc();}
document.querySelectorAll('.vol button').forEach(function(v){v.addEventListener('click',function(){vol=+v.getAttribute('data-v');document.querySelectorAll('.vol button').forEach(function(x){x.classList.remove('on');});v.classList.add('on');calc();});});
// hook pick toggles to recalc (they already toggle .on via earlier handler)
document.querySelectorAll('.pick').forEach(function(p){p.addEventListener('click',function(){
  var on=document.querySelectorAll('.pick.on').length;
  // allow deselecting any item (including defaults), but keep at least 1 selected
  if(p.classList.contains('on')&&on<=1){return;}
  p.classList.toggle('on');
  calc();
});});
calc();
</script>
