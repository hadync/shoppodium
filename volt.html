<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b11;--bg2:#0e131b;--blue:#2f9fe6;--blue2:#4fc0ff;--ink:#eef2f7;--steel:#8c98a8;--edge:rgba(238,242,247,.10);--glow:rgba(47,159,230,.30)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;line-height:1.5;text-align:center;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:48px 20px 62px}
.z{width:50px;height:auto;margin:0 auto 22px;display:block;filter:drop-shadow(0 0 18px var(--glow))}
h1{font-family:'Archivo Black';font-size:clamp(24px,5vw,35px);line-height:1.05;letter-spacing:-.4px;margin-bottom:28px}
h1 .b{color:var(--blue2)}
.toggle{display:flex;gap:5px;justify-content:center;background:var(--edge);padding:5px;border-radius:99px;max-width:330px;margin:0 auto 22px}
.toggle button{flex:1;border:none;background:none;color:var(--steel);font-family:'Barlow Condensed';font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:13px;padding:10px;border-radius:99px;cursor:pointer;transition:.2s}
.toggle button.on{background:var(--blue);color:#04121d}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tier{background:var(--bg2);border:1px solid var(--edge);border-radius:14px;padding:23px 15px;transition:.2s}
.tier.feat{border-color:var(--blue);box-shadow:0 0 44px rgba(47,159,230,.14)}
.tier .name{font-family:'Barlow Condensed';font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--steel);font-size:14px}
.tier .amt{font-family:'Archivo Black';font-size:33px;margin:8px 0 3px}
.tier .amt i{font-size:15px;color:var(--steel);font-style:normal;font-weight:400}
.tier .q{color:var(--steel);font-size:13px;min-height:36px;margin-bottom:5px}
.tier a{display:block;margin-top:12px;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-size:14px;padding:11px;border-radius:8px;text-decoration:none;background:var(--blue);color:#04121d;transition:.2s}
.tier a:hover{background:var(--blue2);box-shadow:0 0 22px var(--glow)}
@media(max-width:600px){.tiers{grid-template-columns:1fr}}
.picklabel{color:var(--steel);font-size:14px;margin:0 auto 14px}
.picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:540px;margin:0 auto 30px}
.pick{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.5px;font-size:14px;padding:9px 15px;border-radius:99px;cursor:pointer;transition:.18s;background:var(--bg2);border:1px solid var(--edge);color:var(--steel)}
.pick.on{background:var(--blue);border-color:var(--blue);color:#04121d}
.pick:not(.on){opacity:.75}
.pick:hover{border-color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <img class="z" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAG4AAABWCAYAAAAucqM7AAADH0lEQVR4nO2dQU7bQBSGnw0FDtFcwouILKoeouIGWbFgUSmnqNQFi658glacgoWjLnyJcImq4HQRPZQGm3jmvZl5E//fCixIRv7yPhLHMcXF5dUFHXC2WN6Vi+W3w+3ADmXfxmJWfYm9EOBGrzhgm66pVxCXKRCXGV1Tr16a+h7iMqN7atdEmLis6Jp6td20v4kgLitemvqev4a4TOiaerX/PcRlAD8h2d8GcRlwKI0I4sxzmEimV9x20z6EXQ4YQ18imaLvIDPR7kBz2GWFIdVx1uJjda19m3+/X18O3t+QOOCG9jsq700bEcSp8eHr+o/WbR2TRoQnJypo/1k5Jo0I4sSESOSYn0MqhcROJIOJE5AikQzEeZIqkQxS6UmqRDKYOA9SJpKBOEdSJ5Ixn8piVs01boffOZaSOpHMudYiQqD56JbspP31aKyFkazHbCqtnU1tJZGMyVTGPmA7BiuJZExOnPaknVIiGXPitHeSNEnWEsmYSiUSOR5TE4dEjseMOCTSDROpRCLdMTFxSKQ7ycUhkX4kTSUS6U/SiUMi/UkmDomUkSSVSKScJBOHRMqJLg6J1CFqKpFIPaJOHBKpRzRxSKQuUVKJROoTZeKQSH2Ci0MiwxA0ldo7afvUrp9/3n72/f1iVs3Pb348aq0nRSKZoBMXIJHSaTOVbAnBxIVIpORs5LPF8k7zA/apEskESSUSGR71iStm1RyJDI+6OO2dhET2oypOeycRyR7d2tNvIZGMmrgQiVR4zXZyiWTUxIVIpGRHnWoiGRVxSGR8xOKQyDSIxSGRaRCJs5ZIbSwmkvH+DLjFRBLtxPO1+aVofeA/BN7irCVyH8s7XAuvVJ56InPAWZzVRE4NZ3GWEzklnMQhkXYYLQ6JtMVocUikLUaJQyLtcVRciGtqIZFyjp5zonnGL9Hu/BHJqQhTeHE9hnfFWbuC3RR5/nX7qe/BOphKSLPB0JPCQXGQZptecbn+J6sp8UYcEpkHb8RBWh78Jw6JzIdXcUhkXryKg7S8KImQyBwpkcg8KSEtT5JfaBT4AXHG2W7ah77t/wAGF3aXmw+SMwAAAABJRU5ErkJggg==" alt="Volt">
  <h1>Branded kits that turn every car<br>into an ad for <span class="b">your shop.</span></h1>
  <p class="picklabel">Build your kit. Tap what you want in it.</p>
  <div class="picker" id="picker">
    <button class="pick on" data-k="fresheners">Air fresheners</button>
    <button class="pick on" data-k="card">Review + referral card</button>
    <button class="pick on" data-k="towels">Microfiber towels</button>
    <button class="pick on" data-k="stickers">Sticker pack</button>
    <button class="pick on" data-k="clings">Windshield clings</button>
  </div>
  <div class="toggle">
    <button class="on" data-f="loose" onclick="setF('loose')">Loose restock</button>
    <button data-f="bags" onclick="setF('bags')">Gift bags</button>
  </div>
  <div class="tiers" id="tiers"></div>
</div>
<script>
var PL={
 loose:[["Trial box","$129","","10 of each item, one time","https://buy.stripe.com/3cI8wP8Mwa3o39Zcynawo02"],
        ["Half kit","$169","/mo","25 of each, cancel anytime","https://buy.stripe.com/fZubJ15Ak2AW7qf8i7awo03",true],
        ["Full kit","$279","/mo","50 of each, cancel anytime","https://buy.stripe.com/14A28r8Mwcbw4e355Vawo04"]],
 bags:[["Trial bags","$149","","10 branded bags, one time","https://buy.stripe.com/4gM4gz5Ak0sO39Z41Rawo05"],
       ["Half kit","$199","/mo","25 branded bags a month","https://buy.stripe.com/eVq7sL8Mw7VgfWL7e3awo06",true],
       ["Full kit","$319","/mo","50 branded bags a month","https://buy.stripe.com/00wfZh7Isb7sfWL41Rawo07"]]
};
function renderT(f){var t=document.getElementById('tiers');t.innerHTML='';PL[f].forEach(function(r){var feat=r[5]?' feat':'';t.innerHTML+='<div class="tier'+feat+'"><div class="name">'+r[0]+'</div><div class="amt">'+r[1]+'<i>'+r[2]+'</i></div><div class="q">'+r[3]+'</div><a href="'+r[4]+'" target="_blank" rel="noopener">Pay & claim</a></div>';});}
function setF(f){document.querySelectorAll('.toggle button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-f')===f);});renderT(f);}
document.querySelectorAll('.pick').forEach(function(p){p.addEventListener('click',function(){
  var on=document.querySelectorAll('.pick.on').length;
  if(p.classList.contains('on')&&on<=1)return;
  p.classList.toggle('on');
});});
renderT('loose');
</script>
</body>
</html>
